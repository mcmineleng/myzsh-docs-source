name: Build and Deploy Docs

on:
  push:
    paths:
      - 'docs/**'
    branches:
      - main  # 或者你的主分支名称

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出主仓库
      - name: 检出源代码仓库
        uses: actions/checkout@v4
        with:
          path: source-repo
          
      # 2. 克隆目标部署仓库
      - name: 克隆目标仓库
        uses: actions/checkout@v4
        with:
          repository: mcmineleng/myzsh-docs  # 目标仓库
          token: ${{ secrets.GITHUB_TOKEN }}
          path: myzsh-docs
          
      # 3. 设置 Node.js 22
      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      # 4. 安装依赖并构建
      - name: 安装依赖并构建文档
        working-directory: ./source-repo
        run: |
          npm install
          npm run docs:build
          
      # 5. 清空目标仓库并复制构建产物
      - name: 部署到 myzsh-docs 仓库
        run: |
          # 清空目标仓库（保留 .git）
          cd myzsh-docs
          # 删除所有文件除了 .git 目录
          find . -maxdepth 1 ! -name '.git' ! -name '.' ! -name '..' -exec rm -rf {} +
          cd ..
          
          # 复制构建产物到目标仓库
          cp -r source-repo/docs/.vuepress/dist/* myzsh-docs/
          
      # 6. 提交并推送更改
      - name: 提交并推送
        working-directory: ./myzsh-docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "更新文档：自动部署 $(date '+%Y-%m-%d %H:%M:%S') [skip ci]" || echo "没有需要提交的更改"
          git push
